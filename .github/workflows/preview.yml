name: Preview Deployment

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: Preview

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Rules alignment
        run: pnpm check:rules

      - name: Build
        run: pnpm build
        env:
          # Database
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

          # Auth
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: https://preview.example.com

          # Email
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: noreply@example.com
          EMAIL_TO: admin@example.com

          # Logging
          LOG_LEVEL: info

          # Supabase
          NEXT_PUBLIC_SUPABASE_URL: https://xxx.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_BUCKET: BUCKET-NAME

          # File Upload
          NEXT_PUBLIC_MAX_FILE_SIZE: 5242880
          NEXT_PUBLIC_ALLOWED_MIME_TYPES: image/jpeg,image/png,image/webp
          STORAGE_TYPE: supabase

          # Stripe
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

          # OAuth (optional)
          GOOGLE_CLIENT_ID: ''
          GOOGLE_CLIENT_SECRET: ''

          # Environment
          NEXT_PUBLIC_NODE_ENV: production

          # Client vars
          NEXT_PUBLIC_APP_URL: https://preview.example.com
          NEXT_PUBLIC_STRIPE_CHECKOUT_TYPE: EmbededForm
          NEXT_PUBLIC_BILLING_MODE: organization

      - name: Test
        run: pnpm test --reporter=verbose
        env:
          # Database
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

          # Auth
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: https://preview.example.com

          # Email
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: noreply@example.com
          EMAIL_TO: admin@example.com

          # Logging
          LOG_LEVEL: info

          # Supabase
          NEXT_PUBLIC_SUPABASE_URL: https://xxx.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_BUCKET: BUCKET-NAME

          # File Upload
          NEXT_PUBLIC_MAX_FILE_SIZE: 5242880
          NEXT_PUBLIC_ALLOWED_MIME_TYPES: image/jpeg,image/png,image/webp
          STORAGE_TYPE: supabase

          # Stripe
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

          # OAuth (optional)
          GOOGLE_CLIENT_ID: ''
          GOOGLE_CLIENT_SECRET: ''

          # Environment
          NEXT_PUBLIC_NODE_ENV: production

          # Client vars
          NEXT_PUBLIC_APP_URL: https://preview.example.com
          NEXT_PUBLIC_STRIPE_CHECKOUT_TYPE: EmbededForm
          NEXT_PUBLIC_BILLING_MODE: organization

      - name: Install Drizzle Kit
        run: npm install -g drizzle-kit

      - name: Run database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Role proprietaire (ADR 002). Secret absent = retombee sur
          # DATABASE_URL, comportement anterieur inchange.
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}

      # Garde-fou de l'echec silencieux (ADR 002) : si le secret DATABASE_URL
      # pointe encore sur un role SUPERUSER ou BYPASSRLS, les policies de
      # tenant sont posees et INERTES, et rien d'autre ne le signale.
      # `db:check` echoue alors, avant tout deploiement.
      - name: Verify application role is subject to RLS
        run: pnpm db:check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # Tests end-to-end sur le build de production, contre une base jetable.
  # Les specs ECRIVENT en base (création de compte) et lisent le seed
  # (user@gmail.com) : ne jamais les pointer sur la base de preview.
  e2e:
    runs-on: ubuntu-latest
    environment: Preview

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # L'application e2e tourne sous le role applicatif, soumis a la RLS :
      # sans ca, les policies sont posees et sans effet, et le test
      # d'isolation inter-tenant passerait sans rien prouver (ADR 002).
      DATABASE_URL: postgresql://asl_app:asl_app@localhost:5432/test
      DATABASE_MIGRATION_URL: postgresql://test:test@localhost:5432/test
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: noreply@example.com
      EMAIL_TO: admin@example.com
      LOG_LEVEL: warn
      NEXT_PUBLIC_SUPABASE_URL: https://xxx.supabase.co
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SUPABASE_BUCKET: BUCKET-NAME
      NEXT_PUBLIC_MAX_FILE_SIZE: 5242880
      NEXT_PUBLIC_ALLOWED_MIME_TYPES: image/jpeg,image/png,image/webp
      STORAGE_TYPE: supabase
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      GOOGLE_CLIENT_ID: ''
      GOOGLE_CLIENT_SECRET: ''
      NEXT_PUBLIC_NODE_ENV: production
      NEXT_PUBLIC_STRIPE_CHECKOUT_TYPE: EmbededForm
      NEXT_PUBLIC_BILLING_MODE: organization
      NEXT_PUBLIC_AUTH_METHODS: credential,magiclink,google,apple,github
      NEXT_PUBLIC_ENABLED_PAGES: organization,account,settings,subscription,notifications,admin,blog,docs,apikey,invitation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Le service postgres de la CI ne joue pas docker/db-init/ : extensions
      # et role applicatif sont a creer ici. `organization.id` a pour defaut
      # `uuid_generate_v4()`, donc sans uuid-ossp la premiere migration echoue.
      # Les ALTER DEFAULT PRIVILEGES doivent preceder les migrations : ils ne
      # valent que pour les tables creees APRES.
      - name: Prepare database role and extensions
        run: |
          PGPASSWORD=test psql -h localhost -U test -d test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          CREATE EXTENSION IF NOT EXISTS "pgcrypto";
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'asl_app') THEN
              CREATE ROLE asl_app LOGIN PASSWORD 'asl_app' NOSUPERUSER NOCREATEDB
                NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
            END IF;
          END
          $$;
          GRANT CONNECT ON DATABASE test TO asl_app;
          GRANT USAGE ON SCHEMA public TO asl_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO asl_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO asl_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE test IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO asl_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE test IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO asl_app;
          SQL

      # `db:push` (drizzle-kit push) NE LIT PAS drizzle/migrations/ : les
      # policies RLS, generees par `generate --custom`, ne seraient jamais
      # creees en CI. D'ou `db:migrate` ici.
      - name: Prepare database
        run: pnpm db:migrate && pnpm db:seed

      # webServer de playwright.config.ts lance `pnpm build && pnpm start` quand CI=1
      - name: Run e2e tests
        run: pnpm test:e2e --project=chromium

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
