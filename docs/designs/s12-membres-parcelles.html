(--muted-foreground);">6e · Mobile 390 · accès refusé</div><div style="width: 390px; border: 1px solid var(--border); border-radius: 24px; background: var(--background); overflow: hidden;"><div style="height: 64px; display: flex; align-items: center; gap: 12px; padding: 0px 16px; border-bottom: 1px solid var(--border);"><span style="width: 12px; height: 12px; border-radius: 999px; background: var(--accent-solid);"></span><span style="font-weight: 600;">Les Amis de l'Étang</span></div><div style="padding: 32px 16px; display: flex; flex-direction: column; gap: 16px;"><h1 style="margin: 0px; font: 600 34px / 1.2 &quot;Source Serif 4&quot;, Georgia, serif;">Cette page ne vous est pas accessible</h1><p style="margin: 0px;">Elle concerne un autre membre de l'association.</p><button style="height: 56px; width: 100%; border: 0px; border-radius: 8px; background: var(--primary); color: var(--primary-foreground); font: 600 17px &quot;Public Sans&quot;, sans-serif;">Revenir à mon espace</button></div></div></div></div></div><aside style="display: flex; flex-direction: column; gap: 16px;"><div style="border: 1px dashed var(--muted-foreground); border-radius: 8px; padding: 16px; background: var(--background); display: flex; flex-direction: column; gap: 8px;"><div style="font: 600 14px &quot;JetBrains Mono&quot;, monospace; color: var(--muted-foreground);">NOTE · marqueur §3.4</div><p style="margin: 0px; font-size: 15px; line-height: 1.5;"><code style="font-family: &quot;JetBrains Mono&quot;, monospace;">Lock</code> + « Espace personnel » + parcelles, une seule fois en haut. Sans parcelle actuelle : « Aucune parcelle actuelle ». L'écran ne contient que des données du membre connecté.</p></div><div style="border: 1px dashed var(--muted-foreground); border-radius: 8px; padding: 16px; background: var(--background); display: flex; flex-direction: column; gap: 8px;"><div style="font: 600 14px &quot;JetBrains Mono&quot;, monospace; color: var(--muted-foreground);">NOTE · lecture</div><p style="margin: 0px; font-size: 15px; line-height: 1.5;">Pas de tableau : 2–3 lignes de 56 px. Dates en clair (« 3 février 1998 »), jamais « période de propriété ». Icône <code style="font-family: &quot;JetBrains Mono&quot;, monospace;">Map</code> en <code style="font-family: &quot;JetBrains Mono&quot;, monospace;">accent-foreground</code> : identité de l'association, elle ne porte aucun statut.</p></div><div style="border: 1px dashed var(--muted-foreground); border-radius: 8px; padding: 16px; background: var(--background); display: flex; flex-direction: column; gap: 8px;"><div style="font: 600 14px &quot;JetBrains Mono&quot;, monospace; color: var(--muted-foreground);">NOTE · accès refusé</div><p style="margin: 0px; font-size: 15px; line-height: 1.5;">Ni nom, ni parcelle de l'autre membre, ni code d'erreur, ni « 403 ». Marqueur personnel absent : la page ne montre aucune donnée personnelle.</p></div><div style="border: 1px dashed var(--muted-foreground); border-radius: 8px; padding: 16px; background: var(--background); display: flex; flex-direction: column; gap: 8px;"><div style="font: 600 14px &quot;JetBrains Mono&quot;, monospace; color: var(--muted-foreground);">NOTE · ancien propriétaire</div><p style="margin: 0px; font-size: 15px; line-height: 1.5;">Les documents anciens viendront avec d'autres stories — rien d'autre n'est dessiné, aucune section vide.</p></div></aside></section><section id="ecarts" data-screen-label="Écarts et points ouverts" style="display: grid; grid-template-columns: 1256px 360px; gap: 32px; align-items: start;"><div style="display: flex; flex-direction: column; gap: 24px; max-width: 880px;"><h2 style="margin: 0px; font: 600 34px / 1.2 &quot;Source Serif 4&quot;, Georgia, serif;">Écarts au design system et points ouverts</h2><div style="border: 1px solid var(--border); border-radius: 8px; background: var(--background); padding: 24px; display: flex; flex-direction: column; gap: 12px;"><h3 style="margin: 0px; font: 600 20px / 1.3 &quot;Public Sans&quot;, sans-serif;">Écarts connus — signalés, pas comblés</h3><ol style="margin: 0px; padding-left: 24px; display: flex; flex-direction: column; gap: 8px;"><li>Aucune icône « membre / propriétaire » — les écrans s'en passent (<a href="#0a">0a</a>).</li><li>« Membres » et « Membres du bureau » voisins — proposition « Propriétaires » (<a href="#0a">0a</a>).</li><li>Historique daté d'une parcelle — liste « Anciennes parcelles » proposée (<a href="#3b">3b</a>, <a href="#3c">3c</a>).</li><li>Retours de courrier (PND) — reste ouvert, non dessiné.</li><li>Recherche dans 400 membres — proposée (<a href="#1a">1a</a>, <a href="#1d">1d</a>).</li></ol></div><div style="border: 1px solid var(--border); border-radius: 8px; background: var(--background); padding: 24px; display: flex; flex-direction: column; gap: 12px;"><h3 style="margin: 0px; font: 600 20px / 1.3 &quot;Public Sans&quot;, sans-serif;">Relevés en cours de maquette</h3><ul style="margin: 0px; padding-left: 24px; display: flex; flex-direction: column; gap: 8px;"><li>Tokens sombres absents du brief : <code style="font-family: &quot;JetBrains Mono&quot;, monospace;">--warning</code>, <code style="font-family: &quot;JetBrains Mono&quot;, monospace;">--warning-foreground</code>, <code style="font-family: &quot;JetBrains Mono&quot;, monospace;">--destructive-foreground</code>, <code style="font-family: &quot;JetBrains Mono&quot;, monospace;">--sidebar-border</code>. Valeurs provisoires dans la maquette — reprendre celles du DS (« trio warning validé »).</li><li>Aucune icône de recherche, de menu ni de fermeture au vocabulaire : libellés écrits (« Menu », « Annuler »).</li><li>Tri par nom avec un champ nom unique : trie par prénom (<a href="#1a">1a</a>).</li><li>Dialog sur mobile : pas de patron au DS — proposé ancré en bas, pleine largeur (<a href="#4e">4e</a>).</li></ul></div><div style="border: 1px solid var(--border); border-radius: 8px; background: var(--background); padding: 24px; display: flex; flex-direction: column; gap: 12px;"><h3 style="margin: 0px; font: 600 20px / 1.3 &quot;Public Sans&quot;, sans-serif;">Laissés au plan</h3><ul style="margin: 0px; padding-left: 24px; display: flex; flex-direction: column; gap: 8px;"><li>Convention de date d'une vente (veille = dernier jour du vendeur).</li><li>Création implicite d'une parcelle inconnue au rattachement.</li><li>Ouverture d'un compte à partir d'une adresse déjà connue du produit.</li><li>Changement d'adresse email d'un membre qui a déjà un compte.</li><li>Rattachement des fiches du bureau et de la présidence.</li><li>Ouvrir un compte n'envoie rien (hypothèse) : l'invitation est une autre story.</li></ul></div></div></section></main></div></div></div>

e vide = absence d'alerte.</p></div><div style="border: 1px dashed var(--muted-foreground); border-radius: 8px; padding: 16px; background: var(--background); display: flex; flex-direction: column; gap: 8px;"><div style="font: 600 14px &quot;JetBrains Mono&quot;, monospace; color: var(--muted-foreground);">NOTE · mobile</div><p style="margin: 0px; font-size: 15px; line-height: 1.5;">10 cartes par page. Contact : l'email, sinon l'adresse postale, sinon « Aucune adresse ». Le bouton « Menu » ouvre la barre latérale en <code style="font-family: &quot;JetBrains Mono&quot;, monospace;">sheet</code> (tiroir sous lg) — libellé écrit, pas d'icône hamburger au vocabulaire.</p></div></aside></section><section id="ecran-2" data-screen-label="2 Ajouter un membre" style="display: grid; grid-template-columns: 1256px 360px; gap: 32px; align-items: start;"><div style="grid-column: 1 / -1; display: flex; flex-direction: column; gap: 8px;"><div style="font: 500 15px &quot;JetBrains Mono&quot;, monospace; color: var(--muted-foreground);">Écran 2 · /bureau/membres/nouveau</div><h2 style="margin: 0px; font: 600 34px / 1.2 &quot;Source Serif 4&quot;, Georgia, serif;">Ajouter un membre</h2><p style="margin: 0px; color: var(--muted-foreground);">Créer une fiche, avec ou sans email, en une seule soumission. Barre latérale omise dans les cadres.</p></div><div style="display: flex; flex-direction: column; gap: 32px;"><div style="display: flex; gap: 16px; align-items: flex-start;"><div id="2a" style="display: flex; flex-direction: column; gap: 8px;"><div style="font: 500 14px &quot;JetBrains Mono&quot;, monospace; color: var(--muted-foreground);">2a · Vierge · zone principale desktop</div><div style="width: 680px; box-sizing: border-box; border: 1px solid var(--border); border-radius: 12px; background: var(--background); padding: 32px; display: flex; flex-direction: column; gap: 24px;"><div style="font-size: 15px; display: flex; gap: 8px;"><a href="#1a">Membres</a><span style="color: var(--mute <script>
(function () {
  var labels = ['Clair', 'Sombre', 'Passer en sombre', 'Passer en clair'];
  var views = {light: document.getElementById('render-light').innerHTML,
               dark: document.getElementById('render-dark').innerHTML};
  var root = document.getElementById('maquette');
  var current = 'light';
  root.innerHTML = views.light;
  document.addEventListener('click', function (event) {
    var button = event.target.closest('button');
    if (!button) return;
    var label = button.textContent.trim();
    if (labels.indexOf(label) === -1) return;
    var next = label === 'Clair' || label === 'Passer en clair' ? 'light' : 'dark';
    if (next === current) return;
    var y = window.scrollY;
    current = next;
    root.innerHTML = views[next];
    window.scrollTo(0, y);
  });
})();
</script>
